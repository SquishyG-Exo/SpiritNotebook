    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1E2" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFD9BE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD9BE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EDE6FB" stop-opacity="0.9"/>
